apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-monitoring
  namespace: flux-system
spec:
  # Handed over to the monitoring-alerting repo; suspended and non-pruning
  # so removing this Kustomization later does not delete the stack.
  suspend: true
  interval: 5m0s
  retryInterval: 1m0s
  timeout: 15m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/clusters/dev/infrastructure/monitoring
  prune: false
  wait: true
