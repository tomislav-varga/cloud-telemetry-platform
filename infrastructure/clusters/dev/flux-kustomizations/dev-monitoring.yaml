apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-monitoring
  namespace: flux-system
spec:
  interval: 5m0s
  retryInterval: 1m0s
  timeout: 15m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/clusters/dev/infrastructure/monitoring
  prune: true
  wait: true
