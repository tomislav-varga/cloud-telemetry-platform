apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: monitoring-alerting
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: flux-system
  url: https://github.com/tomislav-varga/monitoring-alerting.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 5m0s
  retryInterval: 1m0s
  timeout: 15m0s
  sourceRef:
    kind: GitRepository
    name: monitoring-alerting
  path: ./clusters/dev
  prune: true
  wait: true
