apiVersion: monitoring.coreos.com/v1beta1
kind: AlertmanagerConfig
metadata:
  name: telemetry-alert-routing
  namespace: monitoring
spec:
  route:
    receiver: team-webhook
    groupBy:
      - alertname
      - severity
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
  receivers:
    - name: team-webhook
      webhookConfigs:
        - sendResolved: true
          urlSecret:
            name: alertmanager-webhook
            key: url
