apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: telemetry-database-dev
  labels:
    app: postgresql
spec:
  clusterIP: None
  selector:
    app: postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
    - name: metrics
      port: 9187
      targetPort: 9187
