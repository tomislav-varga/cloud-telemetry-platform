apiVersion: batch/v1
kind: Job
metadata:
  name: alembic-migrate
  namespace: telemetry-database-dev
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: alembic-migrate
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgresql
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgresql.telemetry-database-dev.svc.cluster.local -p 5432 -U telemetry_user -d telemetry; do
                echo "waiting for postgresql..."
                sleep 2
              done
      containers:
        - name: alembic
          image: tomsolo1984/cloud-telemetry-backend:1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - alembic upgrade head
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-auth
                  key: postgres-password
            - name: DATABASE_URL
              value: postgresql+asyncpg://telemetry_user:$(POSTGRES_PASSWORD)@postgresql.telemetry-database-dev.svc.cluster.local:5432/telemetry
